name: Windows CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src/optimizer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/optimizer/go.mod
          cache: false
      - name: Go tests
        run: go test ./...
      - name: Static analysis
        run: go vet ./...
      - name: Build native Windows EXE
        shell: pwsh
        run: |
          go build -ldflags="-H windowsgui" -o "$env:RUNNER_TEMP\SAWCHA_OPTIMIZER.exe" .
          if (-not (Test-Path "$env:RUNNER_TEMP\SAWCHA_OPTIMIZER.exe")) { throw 'Build output missing' }
      - name: Keep build unsigned
        shell: pwsh
        run: Write-Host 'CI checks compile only. Production Authenticode signing must use a private signing service and should happen outside this public repository.'
      - name: Upload unsigned development build (manual test only)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sawcha-unsigned-windows-${{ github.run_number }}
          path: ${{ runner.temp }}/SAWCHA_OPTIMIZER.exe
          if-no-files-found: error
          retention-days: 7

  plus-api:
    name: Test private-data-safe Plus API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/plus-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/plus-api/go.mod
          cache: false
      - name: Test webhook and licensing flows
        run: go test -race -cover ./...
      - name: Static analysis
        run: go vet ./...
      - name: Build public customer-only backend
        run: go build ./...
